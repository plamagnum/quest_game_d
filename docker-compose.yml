services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quest_app
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
    env_file:
      - .env
    depends_on:
      - db
        # condition: service_healthy
    networks:
      - quest_net

  webserver:
    image: nginx:1.25-alpine
    container_name: quest_web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - quest_net

  db:
    image: mysql:8.0
    container_name: quest_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    # healthcheck:
    #   test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 10
    networks:
      - quest_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: quest_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      - db
        # condition: service_healthy
    networks:
      - quest_net

  dns:
    image: jpillora/dnsmasq
    container_name: quest_dns
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf
    cap_add:
      - NET_ADMIN
    networks:
      - quest_net


volumes:
  db_data:

networks:
  quest_net:
    driver: bridge